<script>
const intro=document.querySelector('.intro'),site=document.querySelector('.site'),skip=document.querySelector('.skip'),replay=document.querySelector('.replay'),motion=matchMedia('(prefers-reduced-motion: reduce)');
const mark=intro.querySelector('.apostrophe-motion');
let timer,wasReplay=false,run=0,animations=[],effects;
function animate(el,frames,options){const animation=el.animate(frames,options);animations.push(animation);return animation}
function finish(){run++;clearTimeout(timer);clearTimeout(window.introFailsafe);intro.classList.remove('running');intro.setAttribute('aria-hidden','true');skip.tabIndex=-1;site.inert=false;site.classList.remove('revealing');animations.forEach(a=>a.cancel());animations=[];effects?.remove();mark.style.visibility='';if(wasReplay||document.activeElement===skip)replay.focus({preventScroll:true});wasReplay=false}
function effect(className,x,y){const el=document.createElement('i');el.className=className;el.style.left=x+'px';el.style.top=y+'px';effects.append(el);return el}
async function activate(){
 const token=++run;intro.setAttribute('aria-hidden','false');skip.tabIndex=0;site.inert=true;timer=setTimeout(finish,4200);
 effects=document.createElement('div');effects.className='firework-effects';effects.setAttribute('aria-hidden','true');document.body.append(effects);
 const rect=mark.getBoundingClientRect(),unit=intro.querySelector('svg').getBoundingClientRect().width/315;
 const x=rect.left+rect.width/2,y=rect.top+rect.height/2,targetY=Math.max(64,innerHeight*.15),distance=Math.max(50,y-targetY),hop=22/unit;
 try{
  // Three equal 360ms hops. The original SVG placement stays on the inner group.
  await animate(mark,[{transform:'translateY(0)',easing:'cubic-bezier(.2,.7,.35,1)'},{transform:`translateY(${-hop}px)`,offset:.5,easing:'cubic-bezier(.65,0,.8,.3)'},{transform:'translateY(0)'}],{duration:360,iterations:3,delay:180,fill:'forwards'}).finished;
  if(token!==run)return;
  const trail=effect('air-trail',x,y);trail.style.height=Math.max(90,distance*.65)+'px';
  animate(trail,[{transform:'translate(-50%,0) scaleY(.08)',opacity:0},{opacity:.85,offset:.2},{transform:`translate(-50%,${-distance}px) scaleY(1)`,opacity:0}],{duration:260,easing:'cubic-bezier(.65,0,1,.35)',fill:'forwards'});
  [-1,1].forEach((side)=>{const cut=effect('air-cut',x+side*(rect.width/2+8),y-10);animate(cut,[{transform:'translateY(0) scaleY(.3)',opacity:0},{opacity:.65,offset:.25},{transform:`translateY(${-distance}px) scaleY(1.6)`,opacity:0}],{duration:260,fill:'forwards'})});
  await animate(mark,[{transform:'translateY(0)'},{transform:`translateY(${-distance/unit}px)`}],{duration:260,easing:'cubic-bezier(.65,0,1,.35)',fill:'forwards'}).finished;
  if(token!==run)return;mark.style.visibility='hidden';
  for(let i=0;i<24;i++){const angle=i*Math.PI*2/24,reach=Math.min(innerWidth*.45,190)*(i%2?.72:1),spark=effect('spark',x,targetY);spark.style.background=i%3?'#0066ff':'#191a1e';animate(spark,[{transform:`translate(-50%,-50%) rotate(${angle}rad) scaleY(.3)`,opacity:1},{transform:`translate(calc(-50% + ${Math.sin(angle)*reach}px),calc(-50% + ${Math.cos(angle)*reach}px)) rotate(${angle}rad) scaleY(.7)`,opacity:0}],{duration:580,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'})}
  const ring=effect('burst-ring',x,targetY);animate(ring,[{transform:'translate(-50%,-50%) scale(1)',opacity:.8},{transform:'translate(-50%,-50%) scale(22)',opacity:0}],{duration:500,easing:'ease-out',fill:'forwards'});
  site.classList.add('revealing');const radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(targetY,innerHeight-targetY));
  await animate(site,[{clipPath:`circle(0px at ${x}px ${targetY}px)`},{clipPath:`circle(${radius}px at ${x}px ${targetY}px)`}],{duration:650,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}).finished;
  if(token===run)finish();
 }catch(error){if(token===run)finish()}
}
if(intro.classList.contains('running'))activate();
replay.addEventListener('click',()=>{if(motion.matches)return;finish();wasReplay=true;intro.classList.add('running');activate();skip.focus({preventScroll:true})});
window.addEventListener('resize',()=>{if(intro.classList.contains('running'))finish()});
skip.addEventListener('click',finish);document.addEventListener('keydown',e=>{if(e.key==='Escape')finish()});motion.addEventListener('change',()=>{if(motion.matches)finish();replay.hidden=motion.matches});replay.hidden=motion.matches;
</script>
