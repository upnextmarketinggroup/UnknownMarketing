2.28125 -18.796875 C 11.769531 -18.796875 11.488281 -18.785156 11.4375 -18.765625 C 10.351562 -18.765625 9.257812 -18.367188 8.15625 -17.578125 C 7.0625 -16.796875 6.128906 -15.921875 5.359375 -14.953125 L 5.359375 0 L 2.5625 0 L 2.5625 -21.40625 L 5.359375 -21.625 L 5.359375 -16.828125 C 6.410156 -18.171875 7.304688 -19.113281 8.046875 -19.65625 C 9.421875 -20.6875 10.734375 -21.226562 11.984375 -21.28125 C 12.160156 -21.3125 12.476562 -21.328125 12.9375 -21.328125 C 13.394531 -21.328125 14.035156 -21.210938 14.859375 -20.984375 Z M 13.75 -18.421875 " /></g></g></g><g fill="#000000" fill-opacity="1"><g transform="translate(583.485333, 403.654366)"><g><path d="M 2.828125 0.34375 C 2.335938 0.34375 1.984375 0.203125 1.765625 -0.078125 C 1.554688 -0.367188 1.453125 -0.769531 1.453125 -1.28125 C 1.453125 -1.800781 1.585938 -2.21875 1.859375 -2.53125 C 2.128906 -2.84375 2.535156 -3 3.078125 -3 C 3.992188 -3 4.453125 -2.410156 4.453125 -1.234375 C 4.453125 -0.753906 4.300781 -0.367188 4 -0.078125 C 3.707031 0.203125 3.316406 0.34375 2.828125 0.34375 Z M 2.828125 0.34375 " /></g></g></g><g fill="#000000" fill-opacity="1"><g transform="translate(589.615294, 403.654366)"><g /></g></g><g fill="#000000" fill-opacity="1"><g transform="translate(602.422068, 403.654366)"><g /></g></g></svg></div></main>
<footer><span>Brandem</span><button type="button" class="replay">Replay intro ↗</button></footer>
</div>
<script>
const intro=document.querySelector('.intro'),site=document.querySelector('.site'),skip=document.querySelector('.skip'),replay=document.querySelector('.replay'),motion=matchMedia('(prefers-reduced-motion: reduce)');
const mark=intro.querySelector('.apostrophe-motion'),introLogo=intro.querySelector('.intro-logo');
let timer,wasReplay=false,run=0,animations=[],effects;
function animate(el,frames,options){const animation=el.animate(frames,options);animations.push(animation);return animation}
function finish(){run++;clearTimeout(timer);clearTimeout(window.introFailsafe);intro.classList.remove('running');intro.setAttribute('aria-hidden','true');skip.tabIndex=-1;site.inert=false;site.classList.remove('revealing');animations.forEach(a=>a.cancel());animations=[];effects?.remove();mark.style.visibility='';introLogo.style.visibility='';if(wasReplay||document.activeElement===skip)replay.focus({preventScroll:true});wasReplay=false}
function effect(className,x,y){const el=document.createElement('i');el.className=className;el.style.left=x+'px';el.style.top=y+'px';effects.append(el);return el}
async function activate(){
 const token=++run;intro.setAttribute('aria-hidden','false');skip.tabIndex=0;site.inert=true;timer=setTimeout(finish,4200);
 effects=document.createElement('div');effects.className='firework-effects';effects.setAttribute('aria-hidden','true');document.body.append(effects);
 const rect=mark.getBoundingClientRect(),unit=intro.querySelector('svg').getBoundingClientRect().width/315;
 const x=rect.left+rect.width/2,y=rect.top+rect.height/2,targetY=Math.max(64,innerHeight*.15),distance=Math.max(50,y-targetY),hop=22/unit;
 try{
  // Three equal 360ms hops. The original SVG placement stays on the inner group.
  await animate(mark,[{transform:'translateY(0)',easing:'cubic-bezier(.2,.7,.35,1)'},{transform:`translateY(${-hop}px)`,offset:.5,easing:'cubic-bezier(.65,0,.8,.3)'},{transform:'translateY(0)'}],{duration:360,iterations:3,delay:180,fill:'forwards'}).finished;
  if(token!==run)return;
  const trail=effect('air-trail',x,y);trail.style.height=Math.max(90,distance*.65)+'px';
  animate(trail,[{transform:'translate(-50%,0) scaleY(.08)',opacity:0},{opacity:.85,offset:.2},{transform:`translate(-50%,${-distance}px) scaleY(1)`,opacity:0}],{duration:260,easing:'cubic-bezier(.65,0,1,.35)',fill:'forwards'});
  [-1,1].forEach((side)=>{const cut=effect('air-cut',x+side*(rect.width/2+8),y-10);animate(cut,[{transform:'translateY(0) scaleY(.3)',opacity:0},{opacity:.65,offset:.25},{transform:`translateY(${-distance}px) scaleY(1.6)`,opacity:0}],{duration:260,fill:'forwards'})});
  await animate(mark,[{transform:'translateY(0)'},{transform:`translateY(${-distance/unit}px)`}],{duration:260,easing:'cubic-bezier(.65,0,1,.35)',fill:'forwards'}).finished;
  if(token!==run)return;mark.style.visibility='hidden';introLogo.style.visibility='hidden';
  // One shared timeline keeps the revealed homepage exactly inside the blast edge.
  const edge=.94;
  const radius=(Math.hypot(Math.max(x,innerWidth-x),Math.max(targetY,innerHeight-targetY))+24)/.89;
  const wave=effect('blast-wave',x-radius,targetY-radius);
  wave.style.width=wave.style.height=2*radius+'px';
  const timing={duration:420,easing:'cubic-bezier(.12,.72,.16,1)',fill:'forwards'};
  site.classList.add('revealing');
  const reveal=animate(site,[{clipPath:`circle(0px at ${x}px ${targetY}px)`},{clipPath:`circle(${radius*edge}px at ${x}px ${targetY}px)`}],timing);
  const blast=animate(wave,[{transform:'scale(0)'},{transform:'scale(1)'}],timing);
  // Explicitly synchronize both animations, including their very first frame.
  const start=document.timeline.currentTime;reveal.startTime=start;blast.startTime=start;
  await reveal.finished;
  if(token===run)finish();
 }catch(error){if(token===run)finish()}
}
if(intro.classList.contains('running'))activate();
replay.addEventListener('click',()=>{if(motion.matches)return;finish();wasReplay=true;intro.classList.add('running');activate();skip.focus({preventScroll:true})});
window.addEventListener('resize',()=>{if(intro.classList.contains('running'))finish()});
skip.addEventListener('click',finish);document.addEventListener('keydown',e=>{if(e.key==='Escape')finish()});motion.addEventListener('change',()=>{if(motion.matches)finish();replay.hidden=motion.matches});replay.hidden=motion.matches;
</script>
